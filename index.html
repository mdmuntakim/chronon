<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONON</title>
</head>
<body>
<center>
<div id="clock">00:00:00</div>
</center>
<script>
function pad(n){return String(n).padStart(2,'0');}
function tick(){var d=new Date();var t=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());document.getElementById('clock').innerHTML='<font face="monospace">'+t+'</font>';}
tick();setInterval(tick,250);
</script>
</body>
</html>
